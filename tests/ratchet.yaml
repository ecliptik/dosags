    match: '^RATCHET '
    key: lost_inputs
    compare: eq
    limit: 0
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" click --startr 3 --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --env DOSAGS_MI_RENDER_DELAY_MS=150 --env SDL_HINT_DOS_MOUSE_LEVEL_ONLY=1 -- --wait-room 3 --clicks 20 --hold-ms 20

  # ---- SB alive (2026-09-24; LAB-JOURNEYS 8.15 and CAP3b). A dead SB reports underruns=0 and
  # silent_irqs=0 (those count IRQs that happen), so no other check here sees it. The ISR replay's
  # MIDI song clock advances only on SB IRQs: sb_clk_permille = song_ms / rtc_s (ratchet-facts.py).
  # Healthy: 956-1000 (lab and 486); the dead SB of DLY-v1b: 213. Limit 900.
  # Control: the counters-only manifest of that dead-SB run (tests/harness/fixtures/sb-dead-dlyv1b),
  # read by the same parser -- it proves the parser and the limit only, like exe-bytes' control; the
  # live proof (a real SB death seen by this metric) is DLY-v1b in LAB-JOURNEYS.
  - name: sb-alive-clk-sb-5days
    run: sb-5days
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: sb_clk_permille
    compare: ge
    limit: 900
    control: tests/harness/sb-alive-control.sh "$RATCHET_OUT"
  - name: sb-alive-clk-stall
    run: mi-stall-isr
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: sb_clk_permille
    compare: ge
    limit: 900
    control: tests/harness/sb-alive-control.sh "$RATCHET_OUT"
  - name: sb-alive-clk-throttle
    run: mi-throttle-isr
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: sb_clk_permille
    compare: ge
    limit: 900
    control: tests/harness/sb-alive-control.sh "$RATCHET_OUT"

