  # ---- Input: every click and key the host injected reached the engine (journeys.py
  # lost_inputs, end to end), and the host really injected them (else lost_inputs=0 is vacuous).
  # SDL 0221 delivers the presses the level poll misses, so quick clicks survive the ~3 fps of
  # 5 Days room 3 at FIXED 40k (80 ms clicks) and the ~4 fps of the 150 ms render delay (20 ms
  # clicks). Control: the same cell with SDL_HINT_DOS_MOUSE_LEVEL_ONLY=1 (SDL 0222: 0221 off), which
  # loses 12-13 of 21 (F0222 G0, F0221 F3c). Before 0221 these runs held each click 400 ms.
  - name: lost-inputs
    run: clicks
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: lost_inputs
    compare: eq
    limit: 0
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" click --startr 3 --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --env SDL_HINT_DOS_MOUSE_LEVEL_ONLY=1 -- --wait-room 3 --clicks 20 --hold-ms 80 --keys 5
