compat_sweep:
  date: 2026-09-15
  auto_exit_tick: 200
  boots: {ok: true, exit_code: 0}
  title: {ok: true, evidence: "STDOUT.TXT: '(room:1) Now in room 1', no crash, exit_code=0"}
  first_room: {ok: false, failure_reason: "only room 1 was ever loaded during the drive window -- this game's title/start screen waits for player input to advance and none was injected this pass; not a defect, an honest scope limit"}
  playable: {ok: false, attempted: false, failure_reason: "no input-injection automation exists for binary-only games this pass (no AutoPilot module, no generic DOSBox-X input harness proven yet)"}
  complete: {ok: false, attempted: false, failure_reason: "not attempted, same reason as playable"}
  screenshot: not attempted -- see trilbysnotes' own compat_sweep entry for why
