# Shards of God -- porting manifest, per PLAN.md's "Game porting
# framework" section. Produced 2026-09-15 alongside the 32-bit display
# path's real-game validation and the 8/16/32-bit KPI comparison --
# see tests/games/shards/PIN for source/license, inspect-report.json for
# the tool's raw output.

id: shards
title: "Shards of God"
source: see PIN (this directory) -- sha256 + download URL, never the game
        archive itself

data_version: 3060203
compiled_with_editor: "3.6.2.10"
loadable: true
legacy_audio_system: false

resolution: "320x200"
color_depth: 32   # native -- this is one of the two real 32-bit games
                  # used to validate patches/ags/0075 (native 32-bit
                  # display path) and patches/ags/0076
                  # (DOSAGS_FORCE_COLOR_DEPTH benchmarking override)

audio:
  embedded_clip_count: 124   # in the main .ags CLIB itself; mostly OGG
                              # (123 transcoded, 1 already WAV) -- see
                              # convert-report.json
  sibling_vox: true           # audio.vox, NOT embedded -- a real gap in
                               # this framework found and fixed while
                               # porting this game (tools/port-game/
                               # README.md, 2026-09-15). 21 clips, all
                               # OGG, all transcoded.
  needs_host_transcode: true
fonts:
  - {file: agsfnt0.ttf, kind: TrueType (alfont/FreeType path)}
  - {file: agsfnt1.ttf, kind: TrueType (alfont/FreeType path)}
  - {file: agsfnt3.ttf, kind: TrueType (alfont/FreeType path)}
  - {file: agsfnt4.ttf, kind: TrueType (alfont/FreeType path)}
  - {file: AGSFNT2.WFN, kind: native bitmap (WFNFont)}

clib:
  original_lib_version: 30
  repacked_lib_version: 30
  asset_count: 142

driving_recipe: "No AutoPilot module (binary-only game). Same recipe as
  the 8/16/32-bit KPI comparison's other cells: DOSAGS_TAS_AUTO_EXIT_TICK=
  1000 + DOSAGS_FIXED_TIMESTEP=1 (decouples game-speed from render fps,
  see PLAN.md's 'Fixed timestep and the fps KPI' section), sound disabled
  (ACSETUP-OFF.CFG) to remove the audio confound entirely since the
  variable under test is color depth, not audio. The 16-bit arm adds
  DOSAGS_FORCE_COLOR_DEPTH=16 (patches/ags/0076) on top of the same
  recipe -- confirmed via each run's own 'Graphics mode set: ... (N-bit)'
  log line, never trusted from the requested env var alone."

sibling_vox_note: "audio.vox must be staged alongside SHARDS.ags for the
  engine to log audio.vox found and initialized -- tools/port-game/
  port_game.py layout now copies it automatically (2026-09-15 fix), no
  manual step needed."

# Structured driving recipe for tools/port-game/port_game.py validate
# (added 2026-09-16 so this game runs from its manifest alone -- the
# Game porting framework milestone's own gate -- instead of the hand-
# typed run-dosbox.sh flags the 2026-09-15 cells used). Arms are the
# color-depth comparison's own two DOSBox-X cells; DOSAGS_FIXED_TIMESTEP=1
# is applied by validate itself (its default, checked against patch
# 0047's own "DOS-PORT fixed-timestep: ENABLED" log line), and each arm's
# depth is witnessed from the engine's own "Graphics mode set" line, not
# trusted from the env var -- the same rule the driving_recipe above
# states in prose.
validate:
  pkg: shards
  auto_exit_tick: 1000
  timeout_s: 300
  arms:
    depth_32_native:
      cfg: ACSETUP-OFF.CFG
      env: {}
    depth_16_forced:
      cfg: ACSETUP-OFF.CFG
      env:
        DOSAGS_FORCE_COLOR_DEPTH: "16"

expected_runmanifest_dosbox_x:
  depth_32_native:
    exit_code: 0
    audio_vital_status: "NA"
    stdout_contains:
      - "Graphics mode set: 640 x 480 (32-bit) fullscreen desktop"
  depth_16_forced:
    exit_code: 0
    audio_vital_status: "NA"
    stdout_contains:
      - "Graphics mode set: 640 x 480 (16-bit) fullscreen desktop"

# validated: -- one entry per environment. DOSBox-X entries confirm
# MECHANISM only (never a performance number, per this hub's hard rule).
# Real-hardware entries are the actual KPI data.
validated:
  - environment: dosbox-x
    date: 2026-09-15
    note: "mechanism confirmation only, not a performance claim"
    depth_32_native: {tag: S32A, exit_code: 0, fps_p50: 40.00, fps_p95: 40.38, tick_rate: 37.85, graphics_mode_log: "Graphics mode set: 640 x 480 (32-bit) fullscreen desktop"}
    depth_16_forced: {tag: S16A, exit_code: 0, fps_p50: 32.69, fps_p95: 35.24, tick_rate: 37.62, graphics_mode_log: "Graphics mode set: 640 x 480 (16-bit) fullscreen desktop"}
  - environment: HW-486-66
    date: 2026-09-15
    depth_32_native: {tag: S32B7, exit_code: 0, fps_p50: 0.05, fps_p95: 0.05, tick_rate: 0.32, duration_s: 3147, binary_sha12: b60f6e538323, graphics_mode_log: "Graphics mode set: 640 x 480 (32-bit) fullscreen desktop"}
    note: "REAL RESULT, after a long real-hardware investigation across
      7 attempts (S32B1-S32B7) -- see git history for the full account,
      condensed here.

      Attempts 1-3 (S32B1/B2/B3) never reached RUN.BAT at all -- send-file
      failed to verify SHARDS.AGS (2x) or RUN.BAT (1x) after ~180-190s
      each, before vcctrl's REFUSE_BYTES had been raised enough AND
      before its TRANSFER_TIMEOUT_S fix (see below). A real run-rig.sh
      bug was found and fixed along the way (wait_for_job_done masking a
      real send-file failure as UNKNOWN, hanging 30 min instead of
      failing fast) -- orthogonal to the transfer itself succeeding.

      vcctrl's diagnosis (docs/lab/OPEN-FAULTS.md sec. 26-27): a flat
      TRANSFER_TIMEOUT_S=180.0 never scaled to file size, never touched
      when REFUSE_BYTES moved 64->150MB -- SHARDS.AGS's real round trip
      needed ~221-255s, past the fixed window every time. Fixed properly
      (scales with file size, commit b5f4e37) rather than a one-off bump.

      Attempt 4 (S32B4) transferred and ran cleanly but measured the
      WRONG GAME: a stale NOTES.AGS (Trilby's Notes, left over from an
      earlier cell) sorted before SHARDS.AGS in AGS's own directory-scan
      game-file lookup, since RUN.BAT invoked AGS.EXE with no explicit
      path. Fixed in run-rig.sh (explicit $AGS_PKG_NAME argument, a
      strict narrowing of main.cpp's own cmdline parsing) -- a real,
      general correctness gap for any campaign testing more than one
      game against the same target directory, not specific to this
      incident.

      Attempt 5 (S32B7's first launch) ran the correct game and rendered
      its real 32-bit title screen correctly, then appeared to hang after
      ~20 minutes -- confirmed genuinely wedged (PS/2 dead, vcctrl's own
      verify_input failed) via unresponsive mouse-move over 45s and flat
      screen brightness. Power-cycled (operator go-ahead); root cause not
      identified (not this rig's own RDTSC/EMM386 class per vcctrl's own
      read -- a real, separate open question, filed but not chased
      further here since a clean retry was the more useful next step).

      Attempt 6 (S32B7 retry): a NEW run-rig.sh safety check (round-trip
      vc verify-input after the wait, before collecting -- added directly
      in response to attempt 5) itself had a bug (missing --as, refused
      due to lock contention with the script's own held lock, not a real
      hardware fault) -- fixed. Manual relaunch under a directly-held lock
      confirmed the REAL finding this whole investigation was chasing:
      the game was never hung at all past this point -- it was running
      correctly at an extraordinarily low real frame rate. Confirmed via
      mouse hover-highlight changes on the QUIT menu item appearing only
      after multi-minute gaps, and confirmed conclusively by the final
      RUNMANIFEST above: fps_p50=0.05 (~1 frame per 20s), tick_rate=0.32.

      Getting a clean quit for real RUNMANIFEST data needed a further
      real-input-mechanics finding: `mouse click` (an instantaneous
      press+release) can fall entirely between two of the game's own
      widely-spaced input polls and never be observed, since a discrete
      edge needs to overlap an actual poll to be seen -- unlike cursor
      POSITION, which is always current whenever the game does poll.
      `mouse down` held for a full poll interval, then `mouse up`
      (the release edge, not the press, is what AGS's GUI button click
      handling reacted to here) reliably registered. Confirmed live in
      STDOUT.TXT: 'Mouse click over GUI 2' appears three times, followed
      by a clean 'Quitting the game...' / '***** ENGINE HAS SHUTDOWN'.

      Also found and worked around: the rig's own analog capture stick
      (vcctrl_shot) cannot reliably judge frames while this game's 32-bit
      VESA mode is active (returned a stuck frame, then explicit
      no-picture errors) -- vcctrl_camera_shot (the physical webcam)
      confirmed ground truth throughout when the analog capture couldn't.
      Filed as a separate, not-yet-diagnosed vcctrl-side finding
      (docs/lab/OPEN-FAULTS.md sec. 28).

      BOTTOM LINE: native 32-bit color depth rendering (patches/ags/0075)
      is real and correct on real HW-486-66 hardware -- title screen
      renders with correct colors/content, GUI hover and click both work
      -- but at native depth this specific scene's complexity runs at
      roughly 0.05 fps, ~100x slower than Trilby's Notes' native 8-bit
      4.99 fps on the same hardware tier. This is a real, severe,
      measured performance finding for the 40fps KPI push: native 32-bit
      is not viable on 486-class hardware at this content complexity
      without significant optimization work, independent of whether the
      display PATH itself is correct (it is)."
  - environment: dosbox-x
    date: 2026-09-16
    depth_32_native: {tag: VSHAIVE, exit_code: 0, audio_vital_status: "NA", fps_p50: 39.42, fps_p95: 40.38, tick_rate: 37.94, frames_skipped: 53, critical_count: 0, warn_count: 0, binary_sha12: b60f6e538323}
    depth_16_forced: {tag: VSHACED, exit_code: 0, audio_vital_status: "NA", fps_p50: 32.38, fps_p95: 35.58, tick_rate: 37.47, frames_skipped: 231, critical_count: 0, warn_count: 0, binary_sha12: b60f6e538323}
