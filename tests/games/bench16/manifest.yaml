# BENCH16 -- manifest for the self-authored, TAS-driven benchmark fixture at
# 16-bit (HighColor). Same source, same scenes and same scripts as BENCH8
# (tests/games/bench8/manifest.yaml, which this is copied from); only
# Game.agf's <ColorDepth> and the RGBA export of the drawings differ
# (tests/fixtures/bench/README.md, "BENCH16 -- HighColor build"). Not a
# sourced third-party game: source, assets and build live in this repo
# (tests/fixtures/bench/), CC0 assets + MIT scripts + the OFL font.
#
# Arms are SCENES, not sound on/off: one scripted scene per run, chosen by
# the BENCH.CFG each arm stages (extra_files). Build the package first:
#   tests/fixtures/bench/build-host-tools.sh <pristine AGS src at the pin>
#   tests/fixtures/bench/build.sh --depth 16
# then, DOSBox-X:
#   tools/port-game/port_game.py validate --manifest tests/games/bench16/manifest.yaml \
#       --layout-dir tests/harness/games/bench16 --arm all
# and on real hardware, per arm <A> (cfg file tests/fixtures/bench/cfg/<A>.cfg):
#   tests/harness/run-hw.sh bench16 --tag <TAG> \
#       --extra-file tests/harness/games/bench16/ACSETUP-OFF.CFG:ACSETUP.CFG \
#       --extra-file tests/fixtures/bench/cfg/<A>.cfg:BENCH.CFG \
#       --env DOSAGS_TAS_AUTO_EXIT_TICK=1500 --env DOSAGS_SCENE=<A>
#   tools/port-game/port_game.py check --manifest ... --arm <A> --run-dir <collected>
# Every scene's capture is PH01.BMP, a name run-hw.sh already collects.
# CLEAR PH*.BMP AND AUTOPLT.LOG ON THE TARGET BEFORE EACH CELL (AUTOPLT.LOG
# is opened in append mode); the scene-specific pose makes a stale capture
# from a different scene fail its hash, but not one from the same scene.
#
# The 16-bit build carries two objects BENCH8 does not (oGlitchA, oGlitchM:
# the load-time alpha-to-mask regression sprites), so every capture hash
# differs from BENCH8's. Hashes are from tests/harness/expected/bench16/
# dosbox-x.json. The `audio` arm is left out here exactly as in BENCH8's
# manifest (its expected hash is in that JSON if it is wanted).

id: bench16
title: "Bench 16-bit"
source: in-repo -- tests/fixtures/bench/ (see tests/harness/packages/bench/PIN)
license: "assets CC0 1.0; scripts/tooling MIT; font Press Start 2P, SIL OFL 1.1"

data_version: 3060310        # as logged: "Game data version: 3060310"
compiled_with_editor: "3.6.3.13 headless tools (agf2dta/agscc/spritepak/crmpak/agspak), no Editor"
loadable: true
legacy_audio_system: false

resolution: "320x200"        # TRUE 320x200 to the engine, as BENCH8: log reads
color_depth: 16              # "Game native resolution: 320 x 200 (16 bit)". There
                             # is no 16-bit Mode 13h; a 16-bit rung is a VESA mode
audio:
  clip_count: 2
  formats: [midi, wav]       # au000000.mid, au000001.wav (11025 Hz mono 16-bit)
  needs_host_transcode: false
  has_audio_vox: false
  has_speech_vox: false
fonts:
  - {file: agsfnt0.ttf, kind: "TTF (Press Start 2P, OFL) -- exercises alfont/FreeType"}

driving_recipe: "AutoPilot.asc runs the scene named in BENCH.CFG for
  hold_ticks logic ticks, forces a scene-specific fixed pose, waits 40
  still ticks, SaveScreenShot(PH01.BMP), QuitGame -- so the run ends
  itself with a RUNMANIFEST. auto_exit_tick below is only a safety net
  (hold 1000 + settle 40 = ~1045 ticks); a run that needed it fails the
  stdout witnesses. Fixed timestep ON, as for every benchmark cell."

validate:
  pkg: bench16
  auto_exit_tick: 1500
  timeout_s: 240
  arms:
    idle:
      cfg: ACSETUP-OFF.CFG
      extra_files:
        BENCH.CFG: tests/fixtures/bench/cfg/idle.cfg
      env:
        DOSAGS_SCENE: idle
    walk:
      cfg: ACSETUP-OFF.CFG
      extra_files:
        BENCH.CFG: tests/fixtures/bench/cfg/walk.cfg
      env:
        DOSAGS_SCENE: walk
    anim4:
      cfg: ACSETUP-OFF.CFG
      extra_files:
        BENCH.CFG: tests/fixtures/bench/cfg/anim4.cfg
      env:
        DOSAGS_SCENE: anim4
    anim12:
      cfg: ACSETUP-OFF.CFG
      extra_files:
        BENCH.CFG: tests/fixtures/bench/cfg/anim12.cfg
      env:
        DOSAGS_SCENE: anim12
    text:
      cfg: ACSETUP-OFF.CFG
      extra_files:
        BENCH.CFG: tests/fixtures/bench/cfg/text.cfg
      env:
        DOSAGS_SCENE: text
    gui:
      cfg: ACSETUP-OFF.CFG
      extra_files:
        BENCH.CFG: tests/fixtures/bench/cfg/gui.cfg
      env:
        DOSAGS_SCENE: gui
    full:
      cfg: ACSETUP-OFF.CFG
      extra_files:
        BENCH.CFG: tests/fixtures/bench/cfg/full.cfg
      env:
        DOSAGS_SCENE: full

# The block name is historical; `check` applies the same expectations to
# a real-hardware run directory. SaveScreenShot writes the engine's own
# 16-bit virtual screen, so the capture hash is expected to be identical on
# real hardware (AGS Quest's captures were, DOSBox-X vs the Mach64) -- if
# it is not, that is a finding, not a baseline to update.
