# tests/ratchet.yaml -- dosags's deterministic DOSBox-X checks for the hub's ratchet.sh
# (.sdl-dos-ports/shared/tools/ratchet.sh; its header is the format spec, version 1).
#
#   .sdl-dos-ports/shared/tools/ratchet.sh --capture-display N              # every check, no controls
#   .sdl-dos-ports/shared/tools/ratchet.sh --capture-display N --controls   # prove each check can fail
#   tests/harness/nightly-ratchet.sh [--controls]   # unattended: own worktree, clean build, display 271
# The capture runs (gate, clicks) take their Xvfb display from --capture-display (no display: key
# here): a worker running it by hand passes its own (lab-journeys 231); the nightly uses 271.
#
# Every figure here is a COUNT or an exact equality on DOSBox-X -- never a rate, a millisecond or
# a percentile (DOSBox-X predicts rates not at all). Journey timings and stall share are printed
# in each run's facts.txt for reading, and are deliberately not checked here.
#
# Every gating check has a control: a command that breaks what the check guards and must make the
# check FAIL. A check whose control passes has no power (NOPOWER) and fails the run.
#
# QUARANTINED (reported, never gating): agsquest-alias-y60 and shards-alias-512x384, intermittent
# one-tick divergences between the A and B runs (AQ: splash onset 81 vs 82 with sound off;
# Shards: tick 100). Not present-path defects as far as known; see PLAN.md step 8 / gate-0209.
# Also QUARANTINED, information only: shards-alias-512x384 in FIXED mode (gate-shards-fixed). It is
# deterministic and clean on both flavours, but it has no control by construction (static title, see
# its note), and a check without a control cannot gate.
#
# Figures come from tests/harness/ratchet-cell.sh, which writes facts.txt: "RATCHET k=v" lines
# from ratchet-facts.py (audio, verifier, code lock) and journeys.py (ags 0250 journeys, lost
# inputs). A figure the cell cannot give is printed NA, so its check ERRORs rather than passing.
# LAB-JOURNEYS.md section 2 explains each check, its limit and its control.
version: 1

build: make all
build_timeout: 2400

# CYCLES. Each run is labelled FIXED (cycles=fixed 40000, tests/harness/confs/dosbox-x-fixed40k-opl3.conf:
# deterministic whatever else the host runs, hub rule bb5482c) or FULL SPEED (cycles=max: the check
# is about behaviour when the emulated CPU is as fast as the host allows). Only sb-5days and the
# gate stay at full speed; the gate's rows move once the main worker's fixed-cycles test of the AQ
# row is in. (ratchet.sh itself still holds the lock EXCLUSIVE per unit; see LAB-JOURNEYS.md.)
# LOCK (2026-09-24, coordinator's rule). `lock: shared` is only for FIXED runs whose input comes from
# inside the game (AutoPilot, TAS keyed to ticks, or no input). A run driven by xdotool (the click runs
# and their controls) takes the lock EXCLUSIVE even at fixed cycles: fixed cycles fix EMULATED time, but
# a click lands at a WALL-clock time, so beside other runs it falls on a different emulated tick and the
# game can take a different path (lab/journeys CAP2 G35-on: +439 MIDI events). click-cell.sh enforces
# it by itself (lab-lock.sh --exclusive).
runs:
  - name: gate-alias           # FULL SPEED (cycles=max; the existing gate, unchanged)
    kind: capture
    command: tests/harness/gate-alias.sh --out "$RATCHET_OUT" --no-control --no-aq
    timeout: 10800
  - name: gate-aq-fixed   # FIXED, no fixed timestep (the AQ row; main's AQFIX, 52cf7cad)
    kind: capture
    lock: shared
    command: env GATE_CONF="$RATCHET_ROOT/tests/harness/confs/dosbox-x-fixed40k-opl3.conf" GATE_FIXED_TIMESTEP=0 GATE_ASSERT_NO_SKIP=1 tests/harness/gate-alias.sh --out "$RATCHET_OUT" --no-control --rows agsquest-alias-y60
    timeout: 3600
  - name: gate-shards-fixed   # FIXED, no fixed timestep, no-skip assert (the AQ row's mode; 2026-11-04)
    kind: capture
    lock: shared
    command: env GATE_CONF="$RATCHET_ROOT/tests/harness/confs/dosbox-x-fixed40k-opl3.conf" GATE_FIXED_TIMESTEP=0 GATE_ASSERT_NO_SKIP=1 tests/harness/gate-alias.sh --out "$RATCHET_OUT" --no-control --rows shards-alias-512x384
    timeout: 3600
  - name: aq-journeys   # FIXED
    kind: plain
    lock: shared
    command: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab agsquest --fixed-timestep --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --timeout 1800
    timeout: 2400
  - name: sb-5days   # FULL SPEED: PCM accounting, overwrites and MIDI lateness at max speed
    kind: sb-live
    command: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab 5days --fixed-timestep --sb-live --conf tests/harness/confs/dosbox-x-fast-opl3.conf --ags-arg --startr --ags-arg 3 --env DOSAGS_TAS_AUTO_EXIT_TICK=3000 --env DOS_PORT_LOG=1 --timeout 800
    timeout: 1200
  - name: mi-stall-isr   # FIXED
    kind: sb-live
    lock: shared
    command: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab 5days --fixed-timestep --sb-live --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --ags-arg --startr --ags-arg 3 --env DOSAGS_TAS_AUTO_EXIT_TICK=3000 --env DOSAGS_UR3_STALL_EVERY=150 --timeout 900
    timeout: 1300
  - name: mi-throttle-isr   # FIXED
    kind: sb-live
    lock: shared
    command: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab 5days --fixed-timestep --sb-live --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --ags-arg --startr --ags-arg 3 --env DOSAGS_TAS_AUTO_EXIT_TICK=3000 --env DOSAGS_MI_RENDER_DELAY_MS=150 --timeout 900
    timeout: 1300
  - name: clicks   # FIXED, EXCLUSIVE (xdotool input at wall-clock times; see LOCK below)
    kind: capture
    command: tests/harness/ratchet-cell.sh "$RATCHET_OUT" click --startr 3 --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf -- --wait-room 3 --clicks 20 --hold-ms 80 --keys 5
    timeout: 1200
  - name: clicks-throttled-quick   # FIXED, EXCLUSIVE (xdotool input at wall-clock times; see LOCK below)
    kind: capture
    command: tests/harness/ratchet-cell.sh "$RATCHET_OUT" click --startr 3 --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --env DOSAGS_MI_RENDER_DELAY_MS=150 -- --wait-room 3 --clicks 20 --hold-ms 20
    timeout: 1500

checks:
  # ---- Screen equality: every alias-ON row, A (default present) == B (full push), pixel for pixel,
  # at every freeze (gate-alias.sh). Control: the same row with DOSAGS_BREAK_0193=1 on A.
  - name: screen-bench8-alias-idle
    run: gate-alias
    result: $RATCHET_OUT/summary.txt
    match: '^bench8-alias-idle '
    regex: 'compared, ([0-9]+) problem'
    compare: eq
    limit: 0
    control: tests/harness/gate-alias.sh --out "$RATCHET_OUT" --no-control --break-a --rows bench8-alias-idle
  - name: screen-bench8-alias-walk
    run: gate-alias
    result: $RATCHET_OUT/summary.txt
    match: '^bench8-alias-walk '
    regex: 'compared, ([0-9]+) problem'
    compare: eq
    limit: 0
    control: tests/harness/gate-alias.sh --out "$RATCHET_OUT" --no-control --break-a --rows bench8-alias-walk
  - name: screen-bench8-alias-anim4
    run: gate-alias
    result: $RATCHET_OUT/summary.txt
    match: '^bench8-alias-anim4 '
    regex: 'compared, ([0-9]+) problem'
    compare: eq
    limit: 0
    control: tests/harness/gate-alias.sh --out "$RATCHET_OUT" --no-control --break-a --rows bench8-alias-anim4
  - name: screen-bench8-alias-anim12
    run: gate-alias
    result: $RATCHET_OUT/summary.txt
    match: '^bench8-alias-anim12 '
    regex: 'compared, ([0-9]+) problem'
    compare: eq
    limit: 0
    control: tests/harness/gate-alias.sh --out "$RATCHET_OUT" --no-control --break-a --rows bench8-alias-anim12
  - name: screen-bench8-alias-text
    run: gate-alias
    result: $RATCHET_OUT/summary.txt
    match: '^bench8-alias-text '
    regex: 'compared, ([0-9]+) problem'
    compare: eq
    limit: 0
    control: tests/harness/gate-alias.sh --out "$RATCHET_OUT" --no-control --break-a --rows bench8-alias-text
  - name: screen-bench8-alias-gui
    run: gate-alias
    result: $RATCHET_OUT/summary.txt
    match: '^bench8-alias-gui '
    regex: 'compared, ([0-9]+) problem'
    compare: eq
    limit: 0
    control: tests/harness/gate-alias.sh --out "$RATCHET_OUT" --no-control --break-a --rows bench8-alias-gui
  - name: screen-bench8-alias-full
    run: gate-alias
    result: $RATCHET_OUT/summary.txt
    match: '^bench8-alias-full '
    regex: 'compared, ([0-9]+) problem'
    compare: eq
    limit: 0
    control: tests/harness/gate-alias.sh --out "$RATCHET_OUT" --no-control --break-a --rows bench8-alias-full
  - name: screen-agsquest-alias-y60-fixed40k
    run: gate-aq-fixed
    result: $RATCHET_OUT/summary.txt
    match: '^agsquest-alias-y60 .*A==B: ok '
    regex: 'compared, ([0-9]+) problem'
    compare: eq
    limit: 0
    quarantine: true
    note: QUARANTINED until 10 consecutive clean nightly runs in this mode (fixed 40000, no fixed timestep, no skipped frame -- a VOID or FAIL line yields no number, so it counts as not clean); nightly-ratchet.sh appends the running count to the report. At cycles=max the row diverged by one tick (host-timing noise, main 52cf7cad).
  - name: screen-bench8-alias-512x384-idle
    run: gate-alias
    result: $RATCHET_OUT/summary.txt
    match: '^bench8-alias-512x384-idle '
    regex: 'compared, ([0-9]+) problem'
    compare: eq
    limit: 0
    control: tests/harness/gate-alias.sh --out "$RATCHET_OUT" --no-control --break-a --rows bench8-alias-512x384-idle
  - name: screen-bench8-alias-512x384-anim12
    run: gate-alias
    result: $RATCHET_OUT/summary.txt
    match: '^bench8-alias-512x384-anim12 '
    regex: 'compared, ([0-9]+) problem'
    compare: eq
    limit: 0
    control: tests/harness/gate-alias.sh --out "$RATCHET_OUT" --no-control --break-a --rows bench8-alias-512x384-anim12
  - name: screen-bench16-alias-512x384-idle
    run: gate-alias
    result: $RATCHET_OUT/summary.txt
    match: '^bench16-alias-512x384-idle '
    regex: 'compared, ([0-9]+) problem'
    compare: eq
    limit: 0
    control: tests/harness/gate-alias.sh --out "$RATCHET_OUT" --no-control --break-a --rows bench16-alias-512x384-idle
  - name: screen-bench16-alias-512x384-anim12
    run: gate-alias
    result: $RATCHET_OUT/summary.txt
    match: '^bench16-alias-512x384-anim12 '
    regex: 'compared, ([0-9]+) problem'
    compare: eq
    limit: 0
    control: tests/harness/gate-alias.sh --out "$RATCHET_OUT" --no-control --break-a --rows bench16-alias-512x384-anim12
  - name: screen-5days-alias-512x384
    run: gate-alias
    result: $RATCHET_OUT/summary.txt
    match: '^5days-alias-512x384 '
    regex: 'compared, ([0-9]+) problem'
    compare: eq
    limit: 0
    control: tests/harness/gate-alias.sh --out "$RATCHET_OUT" --no-control --break-a --rows 5days-alias-512x384
  - name: screen-shards-alias-512x384
    run: gate-alias
    result: $RATCHET_OUT/summary.txt
    match: '^shards-alias-512x384 '
    regex: 'compared, ([0-9]+) problem'
    compare: eq
    limit: 0
    quarantine: true
    note: QUARANTINED, information only -- FULL SPEED freeze-landing drift; and its control has no power (the title is static after tick 100, dosags 5345e699). Freeze problems per run, 2026-11-04, three runs each in one session -- release 6/4/6, instrumented 4/3/3; every release problem was a VOID 'froze at different ticks', every compared pair was equal (tests/harness/results/REL1-2026-11-04/alias). The FIXED-mode row below is the same scene without the drift.
  - name: screen-shards-alias-512x384-fixed40k
    run: gate-shards-fixed
    result: $RATCHET_OUT/summary.txt
    match: '^shards-alias-512x384 .*A==B: ok '
    regex: 'compared, ([0-9]+) problem'
    compare: eq
    limit: 0
    quarantine: true
    note: QUARANTINED, information only -- no control by construction. The row has no AutoPilot, so it freezes on the Shards title (room 0), which does not move; DOSAGS_BREAK_0193=1 on A leaves A == B at ticks 100-900 and at 10-90 on both flavours, so no break-style control can fail. The --startr probe (operator option (a), 4 rooms, 2026-11-04, tests/harness/results/SHARDSA-2026-11-04) found no room with motion the break can expose -- room 6 equal under --break-a; 1 equal under --break-a and VOID (frames_skipped=-1); 9 VOID (froze at ticks 100 and 300 only); 5 script error on the debug jump. A --startr jump leaves the player at the room's default position. A VOID or FAIL line yields no number.

  # ---- Present verifier (ags 0192) on the cells that already run: no pixel the engine drew was
  # left unpushed. Control: DOSAGS_BREAK_0193=1. Only the AQ cell: 5 Days runs at its default 2x
  # rung, where the narrowed present is always rejected and the verifier cannot fail (its control
  # read NOPOWER in run 20260924T100738Z), so a stale-frames check there would be vacuous.
  - name: stale-frames-aq-journeys
    run: aq-journeys
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: stale_frames
    compare: eq
    limit: 0
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab agsquest --fixed-timestep --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --timeout 1800 --env DOSAGS_BREAK_0193=1

  - name: journeys-room-n
    run: aq-journeys
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: room_n
    compare: eq
    limit: 8
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab agsquest --fixed-timestep --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --timeout 1800 --env DOSAGS_TAS_AUTO_EXIT_TICK=1000
  - name: journeys-save-n
    run: aq-journeys
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: save_n
    compare: eq
    limit: 1
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab agsquest --fixed-timestep --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --timeout 1800 --env DOSAGS_TAS_AUTO_EXIT_TICK=1000
  - name: journeys-load-n
    run: aq-journeys
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: load_n
    compare: eq
    limit: 1
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab agsquest --fixed-timestep --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --timeout 1800 --env DOSAGS_TAS_AUTO_EXIT_TICK=1000
  - name: journeys-boot-n
    run: aq-journeys
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: boot_n
    compare: eq
    limit: 1
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab agsquest --fixed-timestep --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --timeout 1800 --env DOSAGS_JOURNEY_TITLE_ROOM=99
  - name: journeys-unfinished
    run: aq-journeys
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: journeys_unfinished
    compare: eq
    limit: 0
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab agsquest --fixed-timestep --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --timeout 1800 --env DOSAGS_JOURNEY_TITLE_ROOM=99

  # ---- Journey TIMES at FIXED cycles (aq-journeys runs at cycles=fixed 40000): two runs agreed
  # within 0-5 ms (JAQF1/JAQF2-2026-09-23: room p95 12053/12050, load 10714/10709, save 895/895,
  # boot 7746/7742), so each p95 is gated at its measured value + 2%. Fixed 40k ranks by instruction
  # count, not 486 time: these are regression limits, not predictions of the target. Stall share is
  # NOT gated: AGS Quest presents ~4.5/s at fixed 40k, so every window is below 39 (share 1.0).
  # Control: DOSAGS_MI_RENDER_DELAY_MS=150 (ags 0251) slows every present, so every journey.
  - name: journey-boot-p95-ms-fixed
    run: aq-journeys
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: boot_p95_ms
    compare: le
    limit: 7901
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab agsquest --fixed-timestep --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --timeout 1800 --env DOSAGS_MI_RENDER_DELAY_MS=150
  - name: journey-room-p95-ms-fixed
    run: aq-journeys
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: room_p95_ms
    compare: le
    limit: 12295
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab agsquest --fixed-timestep --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --timeout 1800 --env DOSAGS_MI_RENDER_DELAY_MS=150
  - name: journey-save-p95-ms-fixed
    run: aq-journeys
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: save_p95_ms
    compare: le
    limit: 913
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab agsquest --fixed-timestep --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --timeout 1800 --env DOSAGS_MI_RENDER_DELAY_MS=150
  - name: journey-load-p95-ms-fixed
    run: aq-journeys
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: load_p95_ms
    compare: le
    limit: 10929
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab agsquest --fixed-timestep --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --timeout 1800 --env DOSAGS_MI_RENDER_DELAY_MS=150

  # ---- PCM accounting (ags 0252), --sb-live 5 Days with OPL3 music and SB PCM effects:
  # pcm_unaccounted = mixed - pcm_irqs - inflight. Since SDL 0192 every chunk mixed while a sound
  # plays (its own silence included) must reach the device, and nothing else may: 0 is exact
  # (DOSBox-X 2026-09-23: 232 = 232, 108 of them all-zero); +-1 is allowed for a partial chunk
  # or one played between the reads (inflight= needs the 0252 of 2026-09-23 late). Control: SDL_HINT_DOS_SILENCE_DETECT=0 (the gate
  # off entirely, so idle silence is played too and the IRQ count no longer matches the mix).
  - name: pcm-accounting-sb-5days
    run: sb-5days
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: pcm_unaccounted_abs
    compare: le
    limit: 1
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab 5days --fixed-timestep --sb-live --conf tests/harness/confs/dosbox-x-fast-opl3.conf --ags-arg --startr --ags-arg 3 --env DOSAGS_TAS_AUTO_EXIT_TICK=3000 --env DOS_PORT_LOG=1 --timeout 800 --env SDL_HINT_DOS_SILENCE_DETECT=0

  # sound was really mixed (else pcm-accounting reads 0 vacuously). Control: [sound] enabled=0.
  - name: pcm-mixed-sb-5days
    run: sb-5days
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: pcm_mixed
    compare: ge
    limit: 50
    control: bash -c 'mkdir -p "$RATCHET_OUT/cfg" && printf "[sound]\r\nenabled=0\r\n" > "$RATCHET_OUT/cfg/ACSETUP.CFG" && exec tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab 5days --fixed-timestep --sb-live --conf tests/harness/confs/dosbox-x-fast-opl3.conf --ags-arg --startr --ags-arg 3 --env DOSAGS_TAS_AUTO_EXIT_TICK=3000 --timeout 800 --include-extra "$RATCHET_OUT/cfg/ACSETUP.CFG"'

  # The SB ring was never written over unplayed audio (SDL 0190's counter). REPORTED, NOT GATING:
  # no switch makes a correct build overwrite (a 2-chunk ring, and one with no background audio
  # thread, both read 0: run 20260924T100738Z, results/OVWC-2026-09-24), so the check has no
  # control. An overwrite loses audio, so pcm-accounting (which has one) fails on it anyway.
  - name: overwrites-sb-5days
    run: sb-5days
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: overwrites
    compare: eq
    limit: 0
    quarantine: true
    note: reported only -- no control can make a correct build overwrite; pcm-accounting catches the loss

  # ---- No voice runs dry mid-clip (2026-09-30, after the ags 0348 revert): underruns counts mixed chunks in which an active
  # voice whose clip had not ended had no data (the mixer still emits the chunk, that voice contributing zero -- a hole the SB
  # plays as ring data, so silent_irqs cannot see it). 0 in every run on 0347-era builds (ratchets 20260929T204426Z and
  # 20260929T220535Z, all three runs, stalled and throttled included); ags 0348 read underruns == primes (sb-5days 6, stall 4,
  # throttle 5; lab/mmd 569df3b1) and was reverted. Control: that 0348 sb-5days run's counters (underrun-control.sh).
  - name: underruns-sb-5days
    run: sb-5days
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: underruns
    compare: eq
    limit: 0
    control: tests/harness/underrun-control.sh "$RATCHET_OUT"
  - name: underruns-stall
    run: mi-stall-isr
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: underruns
    compare: eq
    limit: 0
    control: tests/harness/underrun-control.sh "$RATCHET_OUT"
  - name: underruns-throttle
    run: mi-throttle-isr
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: underruns
    compare: eq
    limit: 0
    control: tests/harness/underrun-control.sh "$RATCHET_OUT"

  # ---- MIDI on time (SDL 0193-0196, ags 0207-0209): the ISR replay writes no OPL3 register late,
  # at full speed, through forced 1.5 s main-loop stalls (ags 0251 DOSAGS_UR3_STALL_EVERY) and at
  # ~6 renders/s (DOSAGS_MI_RENDER_DELAY_MS=150). midi_late_writes = late_writes (isr) or late50
  # (poll, events > 50 ms late). Control: the same cell on the poll tick (DOSAGS_MIDI_TICK=poll).
  - name: midi-late-sb-5days
    run: sb-5days
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: midi_late_writes
    compare: eq
    limit: 0
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab 5days --fixed-timestep --sb-live --conf tests/harness/confs/dosbox-x-fast-opl3.conf --ags-arg --startr --ags-arg 3 --env DOSAGS_TAS_AUTO_EXIT_TICK=3000 --env DOS_PORT_LOG=1 --timeout 800 --env DOSAGS_MIDI_TICK=poll --env DOSAGS_UR3_STALL_EVERY=150
  - name: midi-late-stall
    run: mi-stall-isr
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: midi_late_writes
    compare: eq
    limit: 0
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" lab 5days --fixed-timestep --sb-live --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf --ags-arg --startr --ags-arg 3 --env DOSAGS_TAS_AUTO_EXIT_TICK=3000 --env DOSAGS_UR3_STALL_EVERY=150 --timeout 900 --env DOSAGS_MIDI_TICK=poll
  # the stall cell's stalls really fired (else midi-late-stall is vacuous). Control: no stalls.
  - name: midi-stall-fired
    run: mi-stall-isr
    result: $RATCHET_OUT/facts.txt
    match: '^RATCHET '
    key: mistall_n
    compare: ge
    limit: 10
