ady-state duration delta (4245s vs 1173s) -- the real depth cost lives in steady state, not load time. FLIP/PRESENT COST (SDLDBG.LOG): same slow UpdateWindowFramebuffer path (fast-path guard failed, use_lfb=1) as 16-bit. Mean flip cost 160.26ms (vs 33.71ms at 16-bit, a 4.75x increase -- MORE than the 2x raw byte-count difference between 32bpp and 16bpp would predict, a real secondary depth-dependent cost in the blit path itself). Only ~100 flushes occurred in the whole 4245s run, so total flip cost is ~16s of 4245s (0.38%) -- an even smaller fraction than at 16-bit (0.3%). CONCLUSION: the 16-bit vs 32-bit difference is NOT concentrated in flip/present cost (cheap and a shrinking fraction at both depths) and NOT concentrated in load-time depth conversion (patch 0076's mechanism adds essentially nothing measurable to sprite_precache). It is concentrated in per-tick, non-flip, non-startup cost -- almost certainly RenderToBackBuffer()'s own CPU-side sprite compositing and/or AGS script VM tick execution, neither instrumented by patch 0078/0035 -- which scales by roughly the same ~3.5-3.6x factor as the overall tick_rate ratio (0.87/0.24=3.6x) between the two depths. See PLAN.md's 40fps push section for the full step-3 comparison writeup."
