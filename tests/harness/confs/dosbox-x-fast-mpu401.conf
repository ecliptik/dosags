# dosbox-x-fast-mpu401.conf -- this port's own DOSBox-X conf for the WaveBlaster/MPU-401 MIDI
# path under emulation (step 8.1, 2026-09-22). Identical to dosbox-x-fast-opl3.conf below plus a
# [midi] section: an intelligent-mode MPU-401 at 330h (the port waveblaster_sink falls back to when
# BLASTER has no P field, SDL_dos_audio_synth.c:863-870) and mididevice=none, so a headless run
# needs no host synth. Correctness only: proves the wb path opens and dispatches, nothing about
# timing or sound.
#
# dosbox-x-fast-opl3.conf -- this port's own DOSBox-X conf for validating
# the OPL3 MIDI path under emulation (dosags Sound gate, acceptance item 1).
#
# Identical to the hub's shared/tools/dosbox-x-fast.conf (cycles=max, the
# non-parity "just run it" conf) except `oplmode = opl3`. The hub's two
# shipped confs set oplmode=none BY DESIGN (emulated OPL is not evidence
# for anything real-hardware; parity runs must not accidentally pass an
# OPL3 gate on emulation), so a port that needs the emulated chip present
# for a correctness-only check keeps its own conf and passes it through
# dosbox-run.sh --conf (hub change 2026-09-16). The 2026-09-13 S7 hand-run
# used an uncommitted scratch copy of exactly this; tests/games/
# trilbysnotes/manifest.yaml's validate: block now names this file so
# port_game.py validate reproduces that arm from the manifest alone.
#
# Regenerate after a hub conf change: copy dosbox-x-fast.conf here and
# re-apply the one oplmode line (keep this header).
# dosbox-x-fast.conf -- fast-iteration profile (generic DOS port parity target)
#
# Identical to tools/dosbox-x.conf except cycles=max -- runs as fast as the
# host CPU allows, ~4-8x faster than a real PODP83.
#
# Use this config for: debugging logic / UI / crash bugs where you just want
# to reach the repro state quickly. DO NOT use for performance judgments --
# audio dropouts, framerate claims, Organya timing validation all require
# the parity config (tools/dosbox-x.conf).

[sdl]
fullscreen = false
output     = surface

[dosbox]
machine    = svga_s3
memsize    = 48
quit warning = false

[cpu]
cputype    = pentium_slow
# Dynamic core is fine here -- we don't care about timing fidelity, just speed.
core       = dynamic
# `max` = flat out, no cycle limit. DOSBox-X will burn host CPU.
cycles     = max

[sblaster]
sbtype     = sb16
sbbase     = 220
irq        = 5
dma        = 1
hdma       = 5
oplmode    = opl3

[midi]
mpu401     = intelligent
mididevice = none

[vesa]
modelist   = compatible

[dos]
xms        = true
ems        = true
umb        = true
# LFN disabled to mirror real-HW MS-DOS 6.22 (no LFN driver) -- see
# tools/dosbox-x.conf for the rationale.
lfn        = false

[render]
aspect     = false
scaler     = none

[autoexec]
# Launchers inject mount + exe via -c flags so this config stays
# invocation-agnostic for those code paths.
#
# The single SET below is defense-in-depth for direct
# `dosbox-x -conf tools/dosbox-x-fast.conf` invocations that bypass the
# launchers -- DOSBox-X's emulated SB16 returns 0xFF on the DSP detection read
# regardless of timing tuning, so SDL3-DOS audio init fails without it. See
# patches/SDL/0001-sb16-dsp-detection-fix.patch fix #4 (DOSBox-X escape hatch).
# Real hardware (g2k Phase 8) MUST NOT set this -- strip if reusing for HW.
SET SDL_DOS_AUDIO_SB_SKIP_DETECTION=1

# Operator-set DOSBox-X environment identifier -- see tools/dosbox-x.conf
# for rationale. Real hardware MUST NOT set this var.
SET DOS_PORT_ENVIRONMENT=dosbox-x
