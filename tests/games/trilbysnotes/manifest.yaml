# Trilby's Notes -- porting manifest, per PLAN.md's "Game porting
# framework" section (`record` stage's own intent: id, verified source,
# license, pinned hash, expected DataVersion/res/depth, audio policy,
# driving recipe -- game data itself never enters git, only this file
# plus results/ records). Original static fields (id/source/license/
# audio/fonts/clib/driving_recipe/sound_toggle/expected_runmanifest_
# dosbox_x) produced by hand, 2026-09-13, S7 (Sound milestone
# acceptance-gate item 4), through tools/port-game/'s then-minimal slice
# (inspect+convert+repack+layout) plus hand-typed run-dosbox.sh flags.
# The `validate:` block and every `validated:` entry from 2026-09-15
# onward are produced by that same tool's now-generalized `validate`/
# `record` subcommands instead -- see tools/port-game/README.md.

id: trilbysnotes
title: "Trilby's Notes"
source: see PIN (this directory) -- sha256 + download URL, never the game
        archive itself

# From tools/port-game/port_game.py inspect (see tests/games/trilbysnotes/
# inspect-report.json, committed alongside this file):
data_version: 27
compiled_with_editor: "2.62"
loadable: true              # DataVersion 27 >= kGameVersion_250 (18)
legacy_audio_system: true   # DataVersion 27 < kGameVersion_320 (41) --
                            # ScanOldStyleAudio's load-time compatibility
                            # shim supplies audio clips from music*.*/
                            # sound*.* naming, confirmed by source read
                            # (no DOS-backend gap -- same load_sound_clip/
                            # audio_core dispatch a modern game's clips use)

# Resolution/color depth: NOT re-derived from GameSetupStructBase (a real
# rabbit hole across DataVersion-gated field layouts -- see port_game.py's
# own module docstring) -- taken from two independent, already-
# authoritative sources instead, cross-checked against each other:
resolution: "320x200"
color_depth: 8
resolution_source: "AGS games database listing (play/game/736) states
  '320x200, 8-Bit (256 Colour)'; the game's own shipped acsetup.cfg (inside
  notes.zip, not committed) states gamecolordepth=8 -- both agree."

audio:
  clip_count: 30            # 10 music*.mid + 20 sound*.wav (see
                             # inspect-report.json's own audio_clips list)
  formats: [midi, wav]
  needs_host_transcode: false  # nothing OGG/MP3/tracker -- convert.py is a
                                # verified no-op for this game (see
                                # convert-report.json: all 78 non-vox
                                # assets are "passthrough", none
                                # "transcoded")
  wav_note: "All 20 WAV clips are 8-bit mono at 24000/44100 Hz, i.e. above
    this port's Tier-2 rate (11025 Hz) -- confirmed NOT to need host-side
    resampling: dos_audio_decode.cpp's own loader already sniffs format
    and resamples/downmixes every clip ONCE, at load time, to the mixer's
    fixed device rate (patches/ags/0050's own header comment). This is a
    real, source-verified correction to this framework's original design
    (which assumed 'WAV/VOC resampled to the tier only if above it' meant
    a HOST-side step) -- it does not, for this port's own engine build."
  has_audio_vox: false
  has_speech_vox: false
fonts:
  - {file: agsfnt0.wfn, kind: native bitmap (WFNFont)}
  - {file: agsfnt1.wfn, kind: native bitmap (WFNFont)}
  - {file: agsfnt2.wfn, kind: native bitmap (WFNFont)}
  # no TTF -- does not exercise the alfont/FreeType text path

clib:
  original_lib_version: 15   # MFLUtil::kMFLVersion_MultiV15 ("unknown
                              # differences" per the engine's own enum
                              # comment; ReadV10's code path handles it,
                              # confirmed by round-trip against the real
                              # file -- see tools/port-game/clib.py)
  repacked_lib_version: 30   # tools/port-game/port_game.py repack always
                              # emits V30 (the only version multifilelib.cpp
                              # itself can WRITE); the pinned engine's
                              # ReadHeader() accepts any supported version
                              # on load, so this is not a compatibility
                              # concern for this port's own build.
  asset_count: 78
  repack_verified: "byte-for-byte identical to the original CLIB, asset
    by asset (all 78), confirmed by an independent read-back + comparison
    script before this manifest was written -- not assumed from the tool
    running without error."

driving_recipe: "No AutoPilot module (binary-only game, no script source
  available) -- per PLAN.md's `validate` stage design, driving is limited
  to DOSAGS_TAS_AUTO_EXIT_TICK (patches/ags/0044), independent of any
  script. Title-screen music (room 1's own PlayMusic(1) call, confirmed
  live via a real DOSBox-X run's own STDOUT.TXT) plus idle fps is the
  Sound gate's own sound-on/off ABBA workload; auto-exit tick 200 (5s of
  40Hz logic time) gives the engine time to load, transition into room 1,
  and start music before quitting cleanly."

sound_toggle: "acsetup.cfg's own [sound] enabled=0/1 (Engine/main/
  config.cpp:416, CfgReadBoolInt) -- a real, already-shipping, zero-patch
  engine feature (confirmed by source read), not a new lever. sound=on
  additionally needs SDL_HINT_DOS_AUDIO_BACKEND=opl3 (RUN.BAT SET, per
  the acceptance gate's own OPL3 pre-registered bar) to select the MIDI
  backend; sound=off needs no MIDI backend hint at all.
  tools/port-game/port_game.py layout emits both ACSETUP-ON.CFG/
  ACSETUP-OFF.CFG variants; tests/harness/run-dosbox.sh's --include-extra
  and run-rig.sh's --extra-file (both added alongside this tool) stage
  whichever variant an ABBA arm needs as the target's actual ACSETUP.CFG."

# Structured driving recipe for tools/port-game/port_game.py validate --
# a machine-readable transcription of the driving_recipe/sound_toggle
# prose above (added when validate/record were generalized from the
# hand-typed run-dosbox.sh flags those sessions actually used; the prose
# stays as the human-readable record of WHY these values were chosen).
# pkg matches tests/harness/games/<pkg>/ (run-dosbox.sh's own convention).
validate:
  pkg: trilbysnotes
  auto_exit_tick: 200   # 5s of 40Hz logic time -- see driving_recipe above
  timeout_s: 180
  # The fast conf with oplmode=opl3 (this port's own copy under tests/
  # harness/confs/, passed through run-dosbox.sh --conf -> the hub's
  # dosbox-run.sh --conf, both 2026-09-16). This is what the 2026-09-13
  # TNSNDON2 hand-run used as an uncommitted scratch conf; with it the
  # sound_on arm's expected midi=opl3 prefix below is reproducible from
  # this manifest alone instead of failing honestly on the stock conf
  # (the 2026-09-15 RCHKV_ON entry documents that pre-fix state).
  dosbox_conf: tests/harness/confs/dosbox-x-fast-opl3.conf
  arms:
    sound_on:
      cfg: ACSETUP-ON.CFG
      env:
        SDL_HINT_DOS_AUDIO_BACKEND: opl3
    sound_off:
      cfg: ACSETUP-OFF.CFG
      env: {}

expected_runmanifest_dosbox_x:
  sound_on:
    audio_vital_status_prefix: "pcm=sb@11025m16,voices=8,underruns=0;midi=opl3,events="
    exit_code: 0
  sound_off:
    audio_vital_status: "NA"
    exit_code: 0

