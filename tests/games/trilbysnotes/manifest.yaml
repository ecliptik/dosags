    note: "40fps push step 3 telemetry, priority 3 (optional fast/normal baseline for comparison against the Shards depth results, patch 0078 DOS-PORT-STARTUP block + DOSAGS_FLIP_INSTR=1). exit_code=0, real RUNMANIFEST, duration_s=81. NOT a clean apples-to-apples baseline against TN8A3 (the prior real-hardware sound_off record, fps_p50=5.22/tick_rate=14.16) -- this run measured fps_p50=0.57/tick_rate=2.91, an unexpected ~5x tick_rate REGRESSION, honestly flagged rather than glossed over. Investigated before concluding anything: (1) env_block_sha and memory_min_free_kb are IDENTICAL between TN8A3 and TNFI1 (aa0172bb39a4, 155008 both), ruling out an environment or memory-pressure difference; (2) frames_skipped is nearly identical (165 vs 168 of a 200-tick target), ruling out a change in the render/skip decision itself; (3) TNFI1SDL.LOG shows only ~5 total UpdateWindowFramebuffer calls in the whole run (never reaching the 100-flush aggregate block), each costing a normal 24-76ms -- flip/present cost is NOT elevated and cannot itself explain a slowdown this large, especially since it wouldn't touch the 165+ SKIPPED (non-rendering) ticks at all; (4) source-read the flip-instrumentation code (vendor/SDL/src/video/dos/SDL_dosframebuffer.c) -- the enable-check is cached after one getenv() read (not re-checked per call), per-call timing overhead is two SDL_GetTicksNS() reads into fixed-size arrays (cheap, O(1)), and the periodic emit-with-fsync block only fires every 100 flips, which never happened here -- no mechanism found in this code that would explain a per-tick slowdown, particularly not one affecting skipped ticks. MOST LIKELY EXPLANATION, not yet confirmed: binary_sha12 differs (TNFI1=c4cfbebf6f85, the post-patch-0078 build, vs TN8A3=c9ee2b121d04, a build from the day before patch 0078 landed) -- TN8A3 and TNFI1 are not actually running the same binary, so this is not a clean flip-instrumentation-on/off comparison; some other change in the intervening patch history (not necessarily patch 0078 itself, whose own new code is startup-only and one-time) may be responsible. Flagged as an open follow-up, not chased further this session -- this cell was explicitly the lowest-priority, optional item, and priorities 1 (S16FI1) and 2 (S32FI1) are the real deliverable. Full raw DOS-PORT-STARTUP block, RUNMANIFEST, STDOUT.TXT, and DOSAGS_FLIP_INSTR SDL debug log preserved verbatim in results/HW-486-66-2026-09-16-TNFI1{.LOG,-STDOUT.TXT,-SDLDBG.LOG}. Startup phase breakdown: subsystem_init=4ms, gamedata_asset_load=6447ms, script_vm_init=1613ms, gfxmode_init=612ms, sprite_index_init=768ms, sprite_precache=1514ms (1 view/10 frames, slowest1_ms=1100), first_room_load=4681ms, total_to_first_frame=20885ms -- a full 25.8% of this run's own 81s duration, a far larger startup fraction than either Shards depth arm saw (3.4%/1.5%), consistent with Trilby's Notes being a much SHORTER total run (auto_exit_tick=200 vs Shards' 1000) rather than evidence of a startup-specific regression."
