    key: host_keys
    compare: eq
    limit: 5
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" click --startr 3 --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf -- --wait-room 3 --clicks 20 --hold-ms 80 --keys 2
