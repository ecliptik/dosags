    compare: eq
    limit: 21
    control: tests/harness/ratchet-cell.sh "$RATCHET_OUT" click --startr 3 --conf tests/harness/confs/dosbox-x-fixed40k-opl3.conf -- --wait-room 3 --clicks 10 --hold-ms 80 --keys 5
