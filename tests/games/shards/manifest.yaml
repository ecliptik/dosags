rder of 3-6 seconds out of 1173. This means flip/present cost, despite using the slow path, is NOT the bottleneck -- something else (per-tick game logic / script VM execution, or RenderToBackBuffer's own CPU-side sprite compositing before Present() is even called, neither of which patch 0078 or patch 0035 instrument) consumes the overwhelming majority of each tick's real time. This redirects the earlier step-4 hypothesis (dirty-rect-free full-frame present as the dominant cost) -- the present step itself is cheap; the bottleneck is upstream of it, in per-tick logic/compositing, not in the framebuffer flip. Needs new instrumentation (a tick-logic/RenderToBackBuffer bracket) to localize further, not yet added this session."
